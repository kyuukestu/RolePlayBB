[dohtml]
<head>
    <style>
        #PC {
            display: flex;
            flex-flow: row wrap;
            gap: 10px;
            justify-content: center;
            align-items: flex-start;
        }

        body {
            background: #222;
            color: white;
            font-family: sans-serif;
        }

        .pokemon-card {
            position: relative;
            aspect-ratio: 1;
            min-width: 120px;
            max-width: 250px;
            min-height: 120px;
            max-height: 250px;
            padding: 5px;
            padding-left: 15px;
            box-sizing: border-box;
            overflow: hidden;
        }

        .ball-mask {
            position: absolute;
            inset: 0;
            mask: no-repeat center/100% url(https://i.imgur.com/TGaxYP4.png);
            -webkit-mask: no-repeat center/100%
                url(https://i.imgur.com/TGaxYP4.png);
            background: linear-gradient(
                0deg,
                var(--primary) 50%,
                var(--secondary) 50%
            );
            transform: rotate(35deg);
        }

        .content {
            position: relative;
            z-index: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(5px 0px 2px #353232);
            background-repeat: no-repeat;
            background-position: center;
        }

        .icon {
            width: 20%;
            aspect-ratio: 1;
            border-radius: 50%;
        }

        .gender {
            mask-repeat: no-repeat;
            mask-position: center;
            mask-size: 85%;

            -webkit-mask-repeat: no-repeat;
            -webkit-mask-position: center;
            -webkit-mask-size: 85%;
        }

        .name {
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            position: absolute;
            top: 50%;
            left: -16px;
            transform: translateY(-50%);
            height: 100%;
            padding: 0px 4px;
            letter-spacing: 1px;
            writing-mode: sideways-lr;
            text-shadow: 1px 1px 3px black;
        }
    </style>
</head>

<body>
    <div id="PC"></div>
</body>
<script>
    const GENDER = {
        male: {
            icon: "https://i.imgur.com/4FI7ot0.png",
            color: "#89CFF0",
        },
        female: {
            icon: "https://i.imgur.com/wpBhCjV.png",
            color: "#F4C2C2",
        },
    };

    const Cordelia = {
        name: "Cordelia",
        image: "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/303.png",
        primaryType: "#B8B8D0",
        secondaryType: "#EE99AC",
        gender: "female",
        size: "100%",
    };

    const Rio = {
        name: "Mor-Rioghain",
        image: "https://www.smogon.com/forums/attachments/058_1-png.420718/",
        primaryType: "#F08030",
        secondaryType: "#B8A038",
        gender: "female",
        size: "100%",
    };

    const PC = [Cordelia, Rio];

    function renderPC(container, PC) {
        if (!container) {
            console.error("PC container not found");
            return;
        }
        container.innerHTML = "";

        PC.forEach((pokemon) => {
            container.appendChild(createPokemonCard(pokemon));
        });
    }

    function createPokemonCard(pokemon) {
        const card = document.createElement("div");
        card.className = "pokemon-card";

        card.innerHTML = `
    <div class="ball-mask"></div>
    <div class="content">
      <div class="gender"></div>
      <div class="name">${pokemon.name}</div>
    </div>
  `;

        card.style.setProperty("--primary", pokemon.primaryType);
        card.style.setProperty("--secondary", pokemon.secondaryType);

        card.querySelector(".content").style.backgroundImage =
            `url(${pokemon.image})`;
        card.querySelector(".content").style.backgroundSize = pokemon.size;

        const genderData = GENDER[pokemon.gender] || GENDER.female;

        const gender = card.querySelector(".gender");
        gender.style.maskImage = `url(${genderData.icon})`;
        gender.style.webkitMaskImage = `url(${genderData.icon})`;
        gender.style.backgroundColor = genderData.color;

        card.querySelector(".name").style.color = "#fff";
        card.querySelector(".name").textContent = pokemon.name;

        return card;
    }

    renderPC(document.querySelector("#PC"), PC);
</script>
[/dohtml]
